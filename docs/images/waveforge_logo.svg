<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="wfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b26"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#bgGrad)" stroke="#262b3d" stroke-width="2"/>

  <!-- Subtle concentric orbit guides -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="#1f2438" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="80" cy="80" r="38" fill="none" stroke="#1f2438" stroke-width="1"/>

  <!-- PolyBLEP Waveform Curves -->
  <path d="M 28 80 C 42 35, 52 125, 66 80 C 80 35, 90 125, 104 80 C 118 35, 126 110, 132 80"
        fill="none" stroke="url(#wfGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Anvil / Diamond Apex Nodes -->
  <polygon points="80,50 86,58 80,66 74,58" fill="#10b981"/>
  <polygon points="80,94 86,102 80,110 74,102" fill="#06b6d4"/>
</svg>
